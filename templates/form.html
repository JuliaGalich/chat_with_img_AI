<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Проста форма</title>
</head>
<body>

  <nav>
    <a href="#">Головна</a> |
    <a href="#">Зареєструватися</a> /
    <a href="#">Увійти</a>
  </nav>

  <hr>

  <form id="simpleForm">
    <label for="userInput">Ваш запит:</label>
    <input type="text" id="userInput" name="userInput" required>
    <button type="submit">Відправити</button>
  </form>

  <div>
    <h3>Текстова відповідь:</h3>
    <p id="textResponse"></p>
  </div>

  <div>
    <h3>Згенероване зображення:</h3>
    <img id="imageResponse" src="" alt="Зображення" style="max-width: 100%;">
  </div>



</body>
</html>
